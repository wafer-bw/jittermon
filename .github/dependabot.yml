version: 2

updates:

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "yearly"
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "yearly"
    target-branch: "main"
    groups:
      all-dependencies:
        patterns:
          - "*"
