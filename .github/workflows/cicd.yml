name: cicd

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
  workflow_call:

permissions:
  contents: read

jobs:

  clean:
    name: clean
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: go mod tidy && git diff --exit-code
      - run: go mod verify
      - run: go fix ./... && git diff --exit-code
      - run: go fmt ./... && git diff --exit-code
      - run: buf format -w && git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - uses: golangci/golangci-lint-action@v9
        with: { version: latest }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: buf lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go test -shuffle=on -v -count=1 -race -failfast -timeout=30s -covermode=atomic -coverprofile=coverage.txt `go list ./... | grep -v /internal/gen`
      - uses: codecov/codecov-action@v7
        with: { token: "${{ secrets.CODECOV_TOKEN }}", slug: wafer-bw/jittermon }

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go test -v -shuffle=on -run=- -bench=. -benchtime=1x -timeout=1m ./...

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: go generate ./... && git diff --exit-code
      - run: buf generate && git diff --exit-code
      - run: go build -o /dev/null ./...

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=gha
          cache-to: type=gha,mode=max
